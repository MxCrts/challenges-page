# ── Pretty URLs for legal pages (referenced by the app stores) ──
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
[[redirects]]
  from = "/delete-account"
  to = "/delete-account.html"
  status = 200

# ── .well-known must be served as JSON (deep links / universal links) ──
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"

# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ── Long cache for fingerprint-free static assets ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
